<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitor Voice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.4;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
      border-radius: 6px;
      border: 1px solid #999;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 6px;
    }

    #structured {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .field {
      margin-top: 14px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    #status {
      margin-top: 18px;
      font-weight: bold;
    }

    .hint {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>🎤 Competitor Voice</h1>

<p class="hint">
  Speak your competitor information naturally. Check the fields before adding it to Google Sheets.
</p>

<label>
  Language:
  <select id="language">
    <option value="en-US">English</option>
    <option value="nl-NL">Dutch</option>
  </select>
</label>

<br><br>

<button onclick="startListening()">🎤 Start Speaking</button>
<button onclick="stopListening()">⏹ Stop</button>

<textarea
  id="transcript"
  placeholder="Your speech will appear here..."
></textarea>

<div id="structured">

  <h2>Check before adding</h2>

  <div class="field">
    <label>Store Link</label>
    <input id="storeLink">
  </div>

  <div class="field">
    <label>Facebook Live Ads Qty</label>
    <input id="facebookAds">
  </div>

  <div class="field">
    <label>SimilarWeb Visits</label>
    <input id="similarWeb">
  </div>

  <div class="field">
    <label>Store Age</label>
    <input id="storeAge">
  </div>

  <div class="field">
    <label>Found Through</label>
    <input id="foundThrough">
  </div>

  <div class="field">
    <label>Offer</label>
    <input id="offer">
  </div>

  <div class="field">
    <label>Notes</label>
    <input id="notes">
  </div>

  <div class="field">
    <label>Google Ads Qty</label>
    <input id="googleAds">
  </div>

  <br>

  <button onclick="processSpeech()">🔄 Structure Information</button>

  <button onclick="submitToSheet()">
    ➕ Add Competitor to Google Sheet
  </button>

  <div id="status"></div>

</div>

<iframe
  name="submitFrame"
  id="submitFrame"
  style="display:none;"
></iframe>

<form
  id="sheetForm"
  method="POST"
  target="submitFrame"
  action="https://script.google.com/macros/s/AKfycbyA-DqzK_YgyLD2ejXM4F8bEYXePJeF3khaOFkNyS6ifWhh9w_eWRAMi24F1lq5A0WH/exec"
  style="display:none;"
>

  <input name="storeLink" id="formStoreLink">
  <input name="facebookAds" id="formFacebookAds">
  <input name="similarWeb" id="formSimilarWeb">
  <input name="storeAge" id="formStoreAge">
  <input name="foundThrough" id="formFoundThrough">
  <input name="offer" id="formOffer">
  <input name="notes" id="formNotes">
  <input name="googleAds" id="formGoogleAds">

</form>

<script>

let recognition = null;
let listening = false;


/* =========================
   SPEECH RECOGNITION
========================= */

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser.");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    document.getElementById("language").value;

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {

    let newText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (event.results[i].isFinal) {
        newText +=
          event.results[i][0].transcript + " ";
      }

    }

    const box =
      document.getElementById("transcript");

    box.value += newText;
  };

  recognition.onerror = function(event) {

    console.log(
      "Speech recognition error:",
      event.error
    );
  };

  recognition.onend = function() {

    if (listening) {

      try {
        recognition.start();
      } catch (error) {
        console.log(error);
      }

    }
  };

  listening = true;

  try {
    recognition.start();
  } catch (error) {
    console.log(error);
  }

  document.getElementById("status").innerText =
    "🎤 Listening...";
}


function stopListening() {

  listening = false;

  if (recognition) {
    recognition.stop();
  }

  document.getElementById("status").innerText =
    "Stopped listening.";

  processSpeech();
}


/* =========================
   BASIC CLEANING
========================= */

function cleanText(text) {

  return text
    .replace(/\s+/g, " ")
    .trim();
}


/* =========================
   SPEECH NORMALIZATION
========================= */

function normalizeSpeech(text) {

  text = cleanText(text);


  /* URL */

  text = text.replace(
    /\bhttps?\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );


  text = text.replace(
    /\bhttps\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );


  /* FACEBOOK ADS */

  text = text.replace(
    /facebook\s+ads?\s*live\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /facebook\s+adslive\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );


  /* SIMILARWEB */

  text = text.replace(
    /similar\s*web\s+visitors?\s*([\d,.]+)/gi,
    "SimilarWeb visitors: $1"
  );


  /* STORE AGE */

  text = text.replace(
    /store\s+(?:age|edge|h)\s*(\d+\s*(?:months?|years?))/gi,
    "Store age: $1"
  );


  /* FACEBOOK AD LIBRARY */

  text = text.replace(
    /facebook\s+(?:at|ad)\s+library(?:\s+the)?/gi,
    "Facebook Ad Library"
  );


  /* OFFER */

  text = text.replace(
    /(?:the\s+)?offer(?:ed)?\s+by\s+two\s+get\s+one\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );

  text = text.replace(
    /(?:the\s+)?offer(?:ed)?\s*:?\s*two\s+get\s+one\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );

  text = text.replace(
    /(?:the\s+)?offer(?:ed)?\s*:?\s*by\s+two\s+get\s+one\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );


  /* NOTES */

  text = text.replace(
    /\bnodes?\s+/gi,
    "Notes: "
  );


  /* COMMON SPEECH ERRORS */

  text = text.replace(
    /\bgood\s+lending\s+page\b/gi,
    "good landing page"
  );


  return text;
}


/* =========================
   STRUCTURE THE SPEECH
========================= */

function processSpeech() {

  let text =
    document.getElementById("transcript").value;

  text = normalizeSpeech(text);

  document.getElementById("transcript").value =
    text;


  /* STORE LINK */

  let match = text.match(
    /https?:\/\/[^\s]+/i
  );

  if (match) {

    document.getElementById("storeLink").value =
      match[0].replace(/[.,]$/, "");
  }


  /* FACEBOOK ADS */

  match = text.match(
    /facebook\s+ads?\s*live\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {

    document.getElementById("facebookAds").value =
      match[1].replace(/,/g, "");
  }


  /* SIMILARWEB */

  match = text.match(
    /similarweb\s+visitors\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {

    document.getElementById("similarWeb").value =
      match[1].replace(/,/g, "");
  }


  /* STORE AGE */

  match = text.match(
    /store\s+age\s*:?\s*(\d+\s*(?:months?|years?))/i
  );

  if (match) {

    document.getElementById("storeAge").value =
      match[1].trim();
  }


  /* FOUND THROUGH */

  match = text.match(
    /found\s+through\s*:?\s*(.*?)(?=\s+(?:offer|notes?|google\s+ads)\b|$)/i
  );

  if (match) {

    let found = match[1].trim();

    found = found.replace(
      /\s+the$/i,
      ""
    );

    found = found.replace(
      /facebook\s+(?:at|ad)\s+library/i,
      "Facebook Ad Library"
    );

    document.getElementById("foundThrough").value =
      found;
  }


  /* OFFER */

  match = text.match(
    /offer\s*:?\s*(.*?)(?=\s+(?:notes?|google\s+ads)\b|$)/i
  );

  if (match) {

    let offer =
      match[1].trim();

    offer = offer.replace(
      /^buy\s+/i,
      ""
    );

    offer = offer.replace(
      /two\s+get\s+one/gi,
      "2 Get 1"
    );

    offer = offer.replace(
      /2\s+get\s+1/gi,
      "2 Get 1"
    );

    offer = offer.replace(
      /\s+/g,
      " "
    );

    if (/2\s+get\s+1/i.test(offer)) {

      document.getElementById("offer").value =
        "Buy 2 Get 1 Free";

    } else {

      document.getElementById("offer").value =
        offer;
    }
  }


  /* NOTES */

  match = text.match(
    /notes?\s*:?\s*(.*?)(?=\s+google\s+ads\b|$)/i
  );

  if (match) {

    let notes =
      match[1].trim();

    notes = notes.replace(
      /\blending\s+page\b/gi,
      "landing page"
    );

    document.getElementById("notes").value =
      notes;
  }


  /* GOOGLE ADS */

  match = text.match(
    /google\s+ads\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {

    document.getElementById("googleAds").value =
      match[1].replace(/,/g, "");
  }


  document.getElementById("status").innerText =
    "✅ Information structured. Check the fields above.";
}


/* =========================
   SEND EXACTLY ONE ROW
========================= */

function submitToSheet() {

  processSpeech();


  document.getElementById("formStoreLink").value =
    document.getElementById("storeLink").value.trim();

  document.getElementById("formFacebookAds").value =
    document.getElementById("facebookAds").value.trim();

  document.getElementById("formSimilarWeb").value =
    document.getElementById("similarWeb").value.trim();

  document.getElementById("formStoreAge").value =
    document.getElementById("storeAge").value.trim();

  document.getElementById("formFoundThrough").value =
    document.getElementById("foundThrough").value.trim();

  document.getElementById("formOffer").value =
    document.getElementById("offer").value.trim();

  document.getElementById("formNotes").value =
    document.getElementById("notes").value.trim();

  document.getElementById("formGoogleAds").value =
    document.getElementById("googleAds").value.trim();


  /* Prevent accidental double-click */

  const button =
    document.querySelector(
      'button[onclick="submitToSheet()"]'
    );

  button.disabled = true;

  button.innerText =
    "⏳ Adding...";


  document.getElementById("sheetForm").submit();


  setTimeout(function() {

    document.getElementById("status").innerText =
      "✅ Competitor sent to Google Sheet.";

    button.disabled = false;

    button.innerText =
      "➕ Add Competitor to Google Sheet";

  }, 1500);
}

</script>

</body>
</html>
