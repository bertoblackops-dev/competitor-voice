<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitor Voice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.4;
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
      border-radius: 6px;
      border: 1px solid #999;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 6px;
    }

    #structured {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .field {
      margin-top: 14px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    #status {
      margin-top: 18px;
      font-weight: bold;
    }

    .hint {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>🎤 Competitor Voice</h1>

<p class="hint">
  Speak naturally or use the field names from the sheet.
</p>

<label>
  Language:
  <select id="language">
    <option value="en-US">English</option>
    <option value="nl-NL">Dutch</option>
  </select>
</label>

<br><br>

<button onclick="startListening()">🎤 Start Speaking</button>
<button onclick="stopListening()">⏹ Stop</button>

<textarea
  id="transcript"
  placeholder="Your speech will appear here..."
></textarea>

<div id="structured">

  <h2>Check before adding</h2>

  <div class="field">
    <label>Store Link</label>
    <input id="storeLink">
  </div>

  <div class="field">
    <label>Facebook Live Ads Qty</label>
    <input id="facebookAds">
  </div>

  <div class="field">
    <label>SimilarWeb Visits</label>
    <input id="similarWeb">
  </div>

  <div class="field">
    <label>Store Age</label>
    <input id="storeAge">
  </div>

  <div class="field">
    <label>Found Through</label>
    <input id="foundThrough">
  </div>

  <div class="field">
    <label>Offer</label>
    <input id="offer">
  </div>

  <div class="field">
    <label>Notes</label>
    <input id="notes">
  </div>

  <div class="field">
    <label>Google Ads Qty</label>
    <input id="googleAds">
  </div>

  <br>

  <button onclick="processSpeech()">
    🔄 Structure Information
  </button>

  <button onclick="submitToSheet()">
    ➕ Add Competitor to Google Sheet
  </button>

  <div id="status"></div>

</div>

<iframe
  name="submitFrame"
  id="submitFrame"
  style="display:none;"
></iframe>

<form
  id="sheetForm"
  method="POST"
  target="submitFrame"
  action="https://script.google.com/macros/s/AKfycbyA-DqzK_YgyLD2ejXM4F8bEYXePJeF3khaOFkNyS6ifWhh9w_eWRAMi24F1lq5A0WH/exec"
  style="display:none;"
>

  <input name="storeLink" id="formStoreLink">
  <input name="facebookAds" id="formFacebookAds">
  <input name="similarWeb" id="formSimilarWeb">
  <input name="storeAge" id="formStoreAge">
  <input name="foundThrough" id="formFoundThrough">
  <input name="offer" id="formOffer">
  <input name="notes" id="formNotes">
  <input name="googleAds" id="formGoogleAds">

</form>

<script>

let mediaRecorder = null;
let audioChunks = [];
let listening = false;

async function startListening() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = function(event) {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = async function() {
      stream.getTracks().forEach(track => track.stop());

      const audioBlob = new Blob(audioChunks, {
        type: mediaRecorder.mimeType || "audio/webm"
      });

      document.getElementById("status").innerText =
        "⏳ Transcribing with AI...";

      try {
        const base64Audio = await blobToBase64(audioBlob);

        const response = await fetch(
          "https://script.google.com/macros/s/AKfycbyA-DqzK_YgyLD2ejXM4F8bEYXePJeF3khaOFkNyS6ifWhh9w_eWRAMi24F1lq5A0WH/exec"
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              action: "transcribe",
              audio: base64Audio,
              mimeType: audioBlob.type
            })
          }
        );

        const result = await response.json();

        if (result.error) {
          throw new Error(result.error);
        }

        document.getElementById("transcript").value +=
          (result.text || "") + " ";

        document.getElementById("status").innerText =
          "✅ Transcription complete.";

      } catch (error) {
        console.error(error);
        document.getElementById("status").innerText =
          "❌ Transcription failed: " + error.message;
      }
    };

    mediaRecorder.start();
    listening = true;

    document.getElementById("status").innerText =
      "🎤 Recording... Click Stop when finished.";

  } catch (error) {
    console.error(error);
    document.getElementById("status").innerText =
      "❌ Microphone error: " + error.message;
  }
}

function stopListening() {
  listening = false;

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onloadend = function() {
      const base64 = reader.result.split(",")[1];
      resolve(base64);
    };

    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}


/* =====================================================
   SPEECH
===================================================== */

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser.");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    document.getElementById("language").value;

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {

    let newText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (event.results[i].isFinal) {

        newText +=
          event.results[i][0].transcript + " ";
      }
    }

    document.getElementById("transcript").value += newText;
  };

  recognition.onerror = function(event) {

    console.log("Speech error:", event.error);

    if (event.error === "not-allowed") {

      document.getElementById("status").innerText =
        "❌ Microphone permission was denied.";

      listening = false;
    }
  };

  recognition.onend = function() {

    if (listening) {

      try {
        recognition.start();
      } catch (e) {}
    }
  };

  listening = true;

  try {
    recognition.start();
  } catch (e) {}

  document.getElementById("status").innerText =
    "🎤 Listening...";
}


function stopListening() {

  listening = false;

  if (recognition) {

    try {
      recognition.stop();
    } catch (e) {}
  }

  document.getElementById("status").innerText =
    "Stopped listening.";

  processSpeech();
}


/* =====================================================
   GENERAL CLEANING
===================================================== */

function cleanText(text) {

  return text
    .replace(/\s+/g, " ")
    .trim();
}


function normalizeNumber(value) {

  if (!value) return "";

  return value
    .replace(/,/g, "")
    .replace(/\./g, function(match, offset, string) {

      /*
        Keep decimal points only when they are
        between digits.
      */
      if (
        offset > 0 &&
        offset < string.length - 1 &&
        /\d/.test(string[offset - 1]) &&
        /\d/.test(string[offset + 1])
      ) {
        return ".";
      }

      return "";
    })
    .replace(/\s+/g, "")
    .trim();
}


/* =====================================================
   SPEECH CORRECTIONS
===================================================== */

function normalizeSpeech(text) {

  text = cleanText(text);


  /* ===================================================
     COMMON CHROME SPEECH ERRORS
  =================================================== */

  text = text.replace(
    /\bstore\s+edge\b/gi,
    "Store age"
  );

  text = text.replace(
    /\bfound\s+true\b/gi,
    "Found through"
  );

  text = text.replace(
    /\bgoogle\s+ads?\s+quantity\b/gi,
    "Google ads"
  );

  text = text.replace(
    /\bfacebook\s+live\s+(?:at|ad)\s+quantity\b/gi,
    "Facebook ads live"
  );

  text = text.replace(
    /\bfacebook\s+live\s+ads?\s+quantity\b/gi,
    "Facebook ads live"
  );

  text = text.replace(
    /\bsimilar\s+web\b/gi,
    "SimilarWeb"
  );

  text = text.replace(
    /\bnodes?\b/gi,
    "Notes"
  );

  text = text.replace(
    /\blending\s+page\b/gi,
    "landing page"
  );

  text = text.replace(
    /\blending\b/gi,
    "landing"
  );


  /* ===================================================
     URLS
  =================================================== */

  text = text.replace(
    /\bhttps?\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );

  text = text.replace(
    /\bhttps?\s*:\s*\/\s*\/\s*([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );

  text = text.replace(
    /\bwww\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "www.$1"
  );


  /* ===================================================
     FACEBOOK ADS
  =================================================== */

  text = text.replace(
    /facebook\s+adslive\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /facebook\s+ads?\s+live\s*:?\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /facebook\s+live\s+ads?\s*:?\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /(\d[\d,.]*)\s+(?:active|live|running)\s+facebook\s+ads?/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /facebook\s+(?:has|shows|is\s+running)\s+(\d[\d,.]*)\s+ads?/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /facebook\s+ads?\s+(?:quantity|qty)\s*:?\s*(\d[\d,.]*)/gi,
    "Facebook ads live: $1"
  );


  /* ===================================================
     SIMILARWEB
  =================================================== */

  text = text.replace(
    /similarweb\s+(?:visitors?|visits?|traffic)\s*:?\s*([\d,.]+)/gi,
    "SimilarWeb visits: $1"
  );

  text = text.replace(
    /similarweb\s+(?:visitors?|visits?|traffic)\s+(?:is|are|shows?)\s+([\d,.]+)/gi,
    "SimilarWeb visits: $1"
  );

  text = text.replace(
    /(?:about|around|roughly|approximately)\s+([\d,.]+)\s+(?:similarweb\s+)?(?:visits?|visitors?)/gi,
    "SimilarWeb visits: $1"
  );

  text = text.replace(
    /([\d,.]+)\s+(?:similarweb\s+)?(?:visits?|visitors?)/gi,
    "SimilarWeb visits: $1"
  );

  text = text.replace(
    /similarweb\s+(?:visits?|visitors?)\s+(?:quantity|qty)\s*:?\s*([\d,.]+)/gi,
    "SimilarWeb visits: $1"
  );


  /* ===================================================
     STORE AGE
  =================================================== */

  text = text.replace(
    /store\s+(?:age|edge|h)\s*:?\s*(\d+\s*(?:months?|years?))/gi,
    "Store age: $1"
  );

  text = text.replace(
    /(?:store|website|shop)\s+(?:is\s+)?(?:about|around|roughly|approximately)?\s*(\d+\s*(?:months?|years?))\s+old/gi,
    "Store age: $1"
  );

  text = text.replace(
    /(?:about|around|roughly|approximately)\s*(\d+\s*(?:months?|years?))\s+old/gi,
    "Store age: $1"
  );

  text = text.replace(
    /store\s+(?:age|edge)\s+(?:is|of)?\s*(\d+\s*(?:months?|years?))/gi,
    "Store age: $1"
  );


  /* ===================================================
     FACEBOOK AD LIBRARY
  =================================================== */

  text = text.replace(
    /facebook\s+(?:at|ad)\s+library(?:\s+the)?/gi,
    "Facebook Ad Library"
  );

  text = text.replace(
    /facebook\s+ads?\s+library/gi,
    "Facebook Ad Library"
  );

  text = text.replace(
    /(?:found|discovered|came\s+across)\s+(?:it\s+)?(?:through|on|via)\s+facebook\s+(?:ad\s+)?library/gi,
    "Found through: Facebook Ad Library"
  );


  /* ===================================================
     OFFERS
  =================================================== */

  text = text.replace(
    /(?:the\s+)?offer(?:ed)?\s+(?:is\s+)?(?:buy\s+|by\s+)?two\s+get\s+one\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );

  text = text.replace(
    /(?:the\s+)?offer(?:ed)?\s+(?:is\s+)?(?:buy\s+|by\s+)?2\s+get\s+1\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );

  text = text.replace(
    /(?:deal|promotion|promo)\s*:?\s*(?:buy\s+|by\s+)?two\s+get\s+one\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );

  text = text.replace(
    /(?:deal|promotion|promo)\s*:?\s*(?:buy\s+|by\s+)?2\s+get\s+1\s+free/gi,
    "Offer: Buy 2 Get 1 Free"
  );


  /* ===================================================
     NOTES
  =================================================== */

  text = text.replace(
    /\bnodes?\s+/gi,
    "Notes: "
  );

  text = text.replace(
    /\b(?:note|notes|details|detail|remark|remarks)\s*:?\s*/gi,
    "Notes: "
  );


  return cleanText(text);
}


/* =====================================================
   FIELD HELPERS
===================================================== */

function setField(id, value) {

  if (
    value !== undefined &&
    value !== null
  ) {

    value = cleanText(value);

    if (value !== "") {

      document.getElementById(id).value =
        value;
    }
  }
}


function getNumberAfter(pattern, text) {

  const match =
    text.match(pattern);

  if (!match) {
    return "";
  }

  return normalizeNumber(match[1]);
}


/* =====================================================
   MAIN PARSER
===================================================== */

function processSpeech() {

  const original =
    document.getElementById("transcript").value;

  let text =
    normalizeSpeech(original);

  document.getElementById("transcript").value =
    text;


  /* ===================================================
     STORE LINK
  =================================================== */

  let urlMatch =
    text.match(
      /(?:https?:\/\/|www\.)[a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s]*)?/i
    );

  if (urlMatch) {

    let url =
      urlMatch[0]
        .replace(/[.,!?]$/, "");

    if (
      url.startsWith("www.")
    ) {
      url =
        "https://" + url;
    }

    setField(
      "storeLink",
      url
    );
  }


  /* ===================================================
     FACEBOOK ADS
  =================================================== */

  let facebook =
    getNumberAfter(
      /facebook\s+ads?\s+live\s*:?\s*(\d[\d,.]*)/i,
      text
    );

  if (!facebook) {

    facebook =
      getNumberAfter(
        /facebook\s+live\s+ads?\s*:?\s*(\d[\d,.]*)/i,
        text
      );
  }

  if (!facebook) {

    facebook =
      getNumberAfter(
        /(\d[\d,.]*)\s+(?:active|live|running)\s+facebook\s+ads?/i,
        text
      );
  }

  setField(
    "facebookAds",
    facebook
  );


  /* ===================================================
     SIMILARWEB
  =================================================== */

  let similarWeb =
    getNumberAfter(
      /similarweb\s+(?:visits?|visitors?|traffic)\s*:?\s*(\d[\d,.]*)/i,
      text
    );

  if (!similarWeb) {

    similarWeb =
      getNumberAfter(
        /(?:about|around|roughly|approximately)?\s*(\d[\d,.]*)\s+(?:similarweb\s+)?(?:visits?|visitors?)/i,
        text
      );
  }

  setField(
    "similarWeb",
    similarWeb
  );


  /* ===================================================
     STORE AGE
  =================================================== */

  let ageMatch =
    text.match(
      /store\s+age\s*:?\s*(\d+\s*(?:months?|years?))/i
    );

  if (!ageMatch) {

    ageMatch =
      text.match(
        /(?:store|website|shop)\s+(?:is\s+)?(?:about|around|roughly|approximately)?\s*(\d+\s*(?:months?|years?))\s+old/i
      );
  }

  if (!ageMatch) {

    ageMatch =
      text.match(
        /(?:about|around|roughly|approximately)\s*(\d+\s*(?:months?|years?))\s+old/i
      );
  }

  if (ageMatch) {

    setField(
      "storeAge",
      ageMatch[1]
    );
  }


  /* ===================================================
     FOUND THROUGH
  =================================================== */

  let foundMatch =
    text.match(
      /found\s+through\s*:?\s*(.*?)(?=\s+(?:offer|deal|promotion|promo|notes?|google\s+ads?)\b|$)/i
    );

  if (!foundMatch) {

    foundMatch =
      text.match(
        /(?:found|discovered|came\s+across)\s+(?:it\s+)?(?:through|on|via)\s+(.*?)(?=\s+(?:offer|deal|promotion|promo|notes?|google\s+ads?)\b|$)/i
      );
  }

  if (foundMatch) {

    let found =
      foundMatch[1]
        .trim()
        .replace(/\s+the$/i, "");

    if (
      /facebook.*library/i.test(found)
    ) {

      found =
        "Facebook Ad Library";
    }

    setField(
      "foundThrough",
      found
    );
  }


  /* ===================================================
     OFFER
  =================================================== */

  let offerMatch =
    text.match(
      /offer\s*:?\s*(.*?)(?=\s+(?:notes?|google\s+ads?)\b|$)/i
    );

  if (!offerMatch) {

    offerMatch =
      text.match(
        /(?:deal|promotion|promo)\s*:?\s*(.*?)(?=\s+(?:notes?|google\s+ads?)\b|$)/i
      );
  }

  if (offerMatch) {

    let offer =
      offerMatch[1]
        .trim()
        .replace(/^buy\s+/i, "")
        .replace(/^by\s+/i, "");

    if (
      /two\s+get\s+one\s+free/i.test(offer) ||
      /2\s+get\s+1\s+free/i.test(offer)
    ) {

      offer =
        "Buy 2 Get 1 Free";

    } else {

      offer =
        offer
          .replace(
            /two\s+get\s+one/gi,
            "2 Get 1"
          )
          .replace(
            /\s+/g,
            " "
          );
    }

    setField(
      "offer",
      offer
    );
  }


  /* ===================================================
     NOTES
  =================================================== */

  let notesMatch =
    text.match(
      /notes?\s*:?\s*(.*?)(?=\s+google\s+ads?\b|$)/i
    );

  if (!notesMatch) {

    notesMatch =
      text.match(
        /(?:detail|details|remark|remarks)\s*:?\s*(.*?)(?=\s+google\s+ads?\b|$)/i
      );
  }

  if (notesMatch) {

    let notes =
      notesMatch[1]
        .trim()
        .replace(
          /\blending\s+page\b/gi,
          "landing page"
        );

    setField(
      "notes",
      notes
    );
  }


  /* ===================================================
     GOOGLE ADS
  =================================================== */

  let googleAds =
    getNumberAfter(
      /google\s+ads?\s*:?\s*(\d[\d,.]*)/i,
      text
    );

  if (!googleAds) {

    googleAds =
      getNumberAfter(
        /(\d[\d,.]*)\s+(?:active|live|running)?\s*google\s+ads?/i,
        text
      );
  }

  setField(
    "googleAds",
    googleAds
  );


  document.getElementById("status").innerText =
    "✅ Information structured. Check the fields before adding.";
}


/* =====================================================
   SUBMIT TO GOOGLE SHEET
===================================================== */

function submitToSheet() {

  processSpeech();


  const values = {

    storeLink:
      document.getElementById("storeLink").value.trim(),

    facebookAds:
      document.getElementById("facebookAds").value.trim(),

    similarWeb:
      document.getElementById("similarWeb").value.trim(),

    storeAge:
      document.getElementById("storeAge").value.trim(),

    foundThrough:
      document.getElementById("foundThrough").value.trim(),

    offer:
      document.getElementById("offer").value.trim(),

    notes:
      document.getElementById("notes").value.trim(),

    googleAds:
      document.getElementById("googleAds").value.trim()
  };


  /* ===================================================
     PUT EXACTLY 8 VALUES INTO FORM
  =================================================== */

  document.getElementById("formStoreLink").value =
    values.storeLink;

  document.getElementById("formFacebookAds").value =
    values.facebookAds;

  document.getElementById("formSimilarWeb").value =
    values.similarWeb;

  document.getElementById("formStoreAge").value =
    values.storeAge;

  document.getElementById("formFoundThrough").value =
    values.foundThrough;

  document.getElementById("formOffer").value =
    values.offer;

  document.getElementById("formNotes").value =
    values.notes;

  document.getElementById("formGoogleAds").value =
    values.googleAds;


  const button =
    document.querySelector(
      'button[onclick="submitToSheet()"]'
    );

  button.disabled = true;

  button.innerText =
    "⏳ Adding...";


  document.getElementById("sheetForm").submit();


  setTimeout(function() {

    document.getElementById("status").innerText =
      "✅ Competitor added to Google Sheet.";

    button.disabled = false;

    button.innerText =
      "➕ Add Competitor to Google Sheet";

  }, 1500);
}

</script>

</body>
</html>
