<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competitor Voice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      margin: 5px 5px 10px 0;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
    }

    button:hover {
      background: #e8e8e8;
    }

    textarea,
    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    #status {
      margin: 15px 0;
      font-weight: bold;
    }

    .field {
      margin-bottom: 8px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

<h1>🎤 Competitor Voice</h1>

<label for="language">Language</label>

<select id="language">
  <option value="en">English</option>
  <option value="nl">Dutch</option>
</select>

<br>

<button onclick="startListening()">🎤 Start Speaking</button>
<button onclick="stopListening()">⏹ Stop Speaking</button>

<div id="status">Ready.</div>

<label for="transcript">Transcript</label>

<textarea
  id="transcript"
  placeholder="Your spoken information will appear here..."
></textarea>

<button onclick="processSpeech()">🧠 Structure Information</button>

<hr>

<div class="field">
  <label>Store Link</label>
  <input id="storeLink">
</div>

<div class="field">
  <label>Facebook Live Ads Qty</label>
  <input id="facebookAds">
</div>

<div class="field">
  <label>SimilarWeb Visits</label>
  <input id="similarWeb">
</div>

<div class="field">
  <label>Store Age</label>
  <input id="storeAge">
</div>

<div class="field">
  <label>Found Through</label>
  <input id="foundThrough">
</div>

<div class="field">
  <label>Offer</label>
  <input id="offer">
</div>

<div class="field">
  <label>Notes</label>
  <input id="notes">
</div>

<div class="field">
  <label>Google Ads Qty</label>
  <input id="googleAds">
</div>

<button onclick="submitToSheet()">➕ Add Competitor to Google Sheet</button>

<!-- Hidden communication iframe -->
<iframe name="transcriptionFrame" id="transcriptionFrame"></iframe>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyA-DqzK_YgyLD2ejXM4F8bEYXePJeF3khaOFkNyS6ifWhh9w_eWRAMi24F1lq5A0WH/exec";

const SHEET_NAME = "Sheet1";

let mediaRecorder = null;
let audioChunks = [];
let listening = false;


/* =====================================================
   RECORD AUDIO
===================================================== */

async function startListening() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }

      };


    mediaRecorder.onstop =
      async function() {

        

        stream.getTracks().forEach(
          track => track.stop()
        );

        const audioBlob =
          new Blob(audioChunks, {
            type:
              mediaRecorder.mimeType ||
              "audio/webm"
          });


        document.getElementById("status").innerText =
          "⏳ Transcribing with AI...";


        try {

          const base64Audio =
            await blobToBase64(audioBlob);


          /*
             Instead of fetch(), submit a normal HTML form
             to a hidden iframe.

             This avoids the CORS preflight problem.
          */

          submitAudioForTranscription(
            base64Audio,
            audioBlob.type
          );

        }

        catch (error) {

          console.error(error);

          document.getElementById("status").innerText =
            "❌ Transcription failed: " +
            error.message;

        }

      };


    mediaRecorder.start();

    listening = true;

    document.getElementById("status").innerText =
      "🎤 Recording... Click Stop when finished.";

  }

  catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Microphone error: " +
      error.message;

  }

}


function stopListening() {

  listening = false;

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* =====================================================
   CONVERT AUDIO TO BASE64
===================================================== */

function blobToBase64(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onloadend =
        function() {

          const base64 =
            reader.result.split(",")[1];

          resolve(base64);

        };

      reader.onerror = reject;

      reader.readAsDataURL(blob);

    }
  );

}


/* =====================================================
   SEND AUDIO TO APPS SCRIPT WITHOUT CORS FETCH
===================================================== */

function submitAudioForTranscription(
  base64Audio,
  mimeType
) {

  const form =
    document.createElement("form");

  form.method = "POST";

  form.action = APPS_SCRIPT_URL;

  form.target = "transcriptionFrame";

  form.style.display = "none";


  const action =
    document.createElement("input");

  action.type = "hidden";

  action.name = "action";

  action.value = "transcribe";


  const audio =
    document.createElement("input");

  audio.type = "hidden";

  audio.name = "audio";

  audio.value = base64Audio;


  const mime =
    document.createElement("input");

  mime.type = "hidden";

  mime.name = "mimeType";

  mime.value = mimeType;


  form.appendChild(action);

  form.appendChild(audio);

  form.appendChild(mime);


  document.body.appendChild(form);

  form.submit();

  form.remove();

}


/* =====================================================
   RECEIVE TRANSCRIPTION FROM APPS SCRIPT
===================================================== */

window.addEventListener(
  "message",
  function(event) {

    if (!event.data) {
      return;
    }

    if (
      event.data.type ===
      "competitor-transcription"
    ) {

      if (event.data.error) {

        document.getElementById(
          "status"
        ).innerText =
          "❌ Transcription failed: " +
          event.data.error;

        return;
      }


      const text =
        event.data.text || "";


      document.getElementById(
        "transcript"
      ).value +=
        text + " ";


      document.getElementById(
        "status"
      ).innerText =
        "✅ Transcription complete.";

    }

  }
);


/* =====================================================
   CLEAN TEXT
===================================================== */

function cleanText(text) {

  return text
    .replace(/\s+/g, " ")
    .trim();

}


/* =====================================================
   NUMBER NORMALIZATION
===================================================== */

function normalizeNumber(value) {

  if (!value) {
    return "";
  }

  value = value
    .toString()
    .replace(/[^\d.,]/g, "");

  if (
    value.includes(",") &&
    value.includes(".")
  ) {

    value =
      value.replace(/,/g, "");

  }

  else if (
    value.includes(",")
  ) {

    value =
      value.replace(/,/g, "");

  }

  return value;

}


/* =====================================================
   URL EXTRACTION
===================================================== */

function normalizeUrl(text) {

  if (!text) {
    return "";
  }

  const match =
    text.match(
      /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/
    );

  if (!match) {
    return "";
  }

  let url =
    match[1]
      .replace(/[.,!?]+$/, "");

  if (
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ) {

    url =
      "https://" + url;

  }

  return url;

}


/* =====================================================
   STRUCTURE SPEECH
===================================================== */

function processSpeech() {

  const text =
    cleanText(
      document.getElementById(
        "transcript"
      ).value
    );

  if (!text) {

    document.getElementById(
      "status"
    ).innerText =
      "❌ No transcript available.";

    return;

  }


  /*
     Store Link
  */

  const storeMatch =
    text.match(
      /(?:store\s*link|website|site|shop)\s*:?\s*([^\s,]+)/i
    );

  if (storeMatch) {

    document.getElementById(
      "storeLink"
    ).value =
      normalizeUrl(storeMatch[1]);

  }

  else {

    document.getElementById(
      "storeLink"
    ).value =
      normalizeUrl(text);

  }


  /*
     Facebook Ads
  */

  const facebookMatch =
    text.match(
      /(?:facebook\s*(?:live\s*)?ads?|facebook\s*ads?\s*(?:live)?|fb\s*ads?)\D{0,30}(\d[\d,.]*)/i
    );

  if (facebookMatch) {

    document.getElementById(
      "facebookAds"
    ).value =
      normalizeNumber(
        facebookMatch[1]
      );

  }


  /*
     SimilarWeb
  */

  const similarMatch =
    text.match(
      /(?:similar\s*web|similarweb)[^\d]{0,40}([\d,.]+)/i
    );

  if (similarMatch) {

    document.getElementById(
      "similarWeb"
    ).value =
      normalizeNumber(
        similarMatch[1]
      );

  }


  /*
     Store Age
  */

  const ageMatch =
    text.match(
      /(?:store\s*age|store\s*is|website\s*is|about)\D{0,30}(\d+(?:\.\d+)?)\s*(months?|years?)/i
    );

  if (ageMatch) {

    document.getElementById(
      "storeAge"
    ).value =
      ageMatch[1] +
      " " +
      ageMatch[2];

  }


  /*
     Found Through
  */

  const foundMatch =
    text.match(
      /found\s*(?:through|via)\s*:?\s*(.*?)(?=\s+(?:offer|notes?|google\s*ads?|facebook\s*ads?)\b|$)/i
    );

  if (foundMatch) {

    document.getElementById(
      "foundThrough"
    ).value =
      foundMatch[1].trim();

  }

  else if (
    /facebook\s*ad\s*library/i.test(text)
  ) {

    document.getElementById(
      "foundThrough"
    ).value =
      "Facebook Ad Library";

  }


  /*
     Offer
  */

  const offerMatch =
    text.match(
      /offer\s*:?\s*(.*?)(?=\s+(?:notes?|bijzonderheden|google\s*ads?|facebook\s*ads?)\b|$)/i
    );

  if (offerMatch) {

    document.getElementById(
      "offer"
    ).value =
      offerMatch[1].trim();

  }


  /*
     Notes
  */

  const notesMatch =
    text.match(
      /(?:notes?|bijzonderheden)\s*:?\s*(.*?)(?=\s+(?:google\s*ads?|facebook\s*ads?)\b|$)/i
    );

  if (notesMatch) {

    document.getElementById(
      "notes"
    ).value =
      notesMatch[1].trim();

  }


  /*
     Google Ads
  */

  const googleMatch =
    text.match(
      /google\s*ads?\D{0,40}(\d[\d,.]*)/i
    );

  if (googleMatch) {

    document.getElementById(
      "googleAds"
    ).value =
      normalizeNumber(
        googleMatch[1]
      );

  }


  document.getElementById(
    "status"
  ).innerText =
    "✅ Information structured.";

}


/* =====================================================
   SEND TO GOOGLE SHEETS
===================================================== */

function submitToSheet() {

  const form =
    document.createElement("form");

  form.method = "POST";

  form.action = APPS_SCRIPT_URL;

  form.target =
    "transcriptionFrame";

  form.style.display = "none";


  const fields = {

    storeLink:
      document.getElementById(
        "storeLink"
      ).value,

    facebookAds:
      document.getElementById(
        "facebookAds"
      ).value,

    similarWeb:
      document.getElementById(
        "similarWeb"
      ).value,

    storeAge:
      document.getElementById(
        "storeAge"
      ).value,

    foundThrough:
      document.getElementById(
        "foundThrough"
      ).value,

    offer:
      document.getElementById(
        "offer"
      ).value,

    notes:
      document.getElementById(
        "notes"
      ).value,

    googleAds:
      document.getElementById(
        "googleAds"
      ).value

  };


  for (
    const key in fields
  ) {

    const input =
      document.createElement("input");

    input.type = "hidden";

    input.name = key;

    input.value =
      fields[key];

    form.appendChild(input);

  }


  document.body.appendChild(form);

  form.submit();

  form.remove();


  document.getElementById(
    "status"
  ).innerText =
    "✅ Competitor sent to Google Sheet.";

}

</script>

</body>
</html>
