<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitor Voice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px 5px 5px 0;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    #structured {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🎤 Competitor Voice</h1>

<label>
  Language:
  <select id="language">
    <option value="en-US">English</option>
    <option value="nl-NL">Dutch</option>
  </select>
</label>

<br><br>

<button onclick="startListening()">🎤 Start Speaking</button>
<button onclick="stopListening()">⏹ Stop</button>

<textarea id="transcript" placeholder="Your speech will appear here..."></textarea>

<div id="structured">

  <h2>Check before adding</h2>

  <div class="field">
    <label>Store Link</label>
    <input id="storeLink">
  </div>

  <div class="field">
    <label>Facebook Live Ads Qty</label>
    <input id="facebookAds">
  </div>

  <div class="field">
    <label>SimilarWeb Visits</label>
    <input id="similarWeb">
  </div>

  <div class="field">
    <label>Store Age</label>
    <input id="storeAge">
  </div>

  <div class="field">
    <label>Found Through</label>
    <input id="foundThrough">
  </div>

  <div class="field">
    <label>Offer</label>
    <input id="offer">
  </div>

  <div class="field">
    <label>Notes</label>
    <input id="notes">
  </div>

  <div class="field">
    <label>Google Ads Qty</label>
    <input id="googleAds">
  </div>

  <br>

  <button onclick="processSpeech()">🔄 Structure Information</button>
  <button onclick="submitToSheet()">➕ Add Competitor to Google Sheet</button>

  <div id="status"></div>

</div>

<iframe name="submitFrame" style="display:none;"></iframe>

<form
  id="sheetForm"
  method="POST"
  target="submitFrame"
  action="https://script.google.com/macros/s/AKfycbyA-DqzK_YgyLD2ejXM4F8bEYXePJeF3khaOFkNyS6ifWhh9w_eWRAMi24F1lq5A0WH/exec"
  style="display:none;"
>

  <input name="storeLink" id="formStoreLink">
  <input name="facebookAds" id="formFacebookAds">
  <input name="similarWeb" id="formSimilarWeb">
  <input name="storeAge" id="formStoreAge">
  <input name="foundThrough" id="formFoundThrough">
  <input name="offer" id="formOffer">
  <input name="notes" id="formNotes">
  <input name="googleAds" id="formGoogleAds">

</form>

<script>

let recognition;
let listening = false;

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser.");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    document.getElementById("language").value;

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {

    let text = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript + " ";
    }

    const box = document.getElementById("transcript");

    box.value += text;

  };

  recognition.onerror = function(event) {
    console.log("Speech recognition error:", event.error);
  };

  recognition.onend = function() {
    if (listening) {
      try {
        recognition.start();
      } catch(e) {}
    }
  };

  listening = true;
  recognition.start();

  document.getElementById("status").innerText =
    "🎤 Listening...";
}


function stopListening() {

  listening = false;

  if (recognition) {
    recognition.stop();
  }

  document.getElementById("status").innerText =
    "Stopped listening.";

  processSpeech();
}


function cleanText(text) {

  return text
    .replace(/\s+/g, " ")
    .trim();
}


function normalizeSpeech(text) {

  text = cleanText(text);

  // URL correction
  text = text.replace(
    /\bhttps?\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );

  text = text.replace(
    /\bhttps\s+([a-z0-9.-]+\.[a-z]{2,})/gi,
    "https://$1"
  );

  // Common speech-recognition errors
  text = text.replace(
    /facebook\s+ads\s*live\s*(\d+)/gi,
    "Facebook ads live: $1"
  );

  text = text.replace(
    /similar\s*web\s+visitors?\s*([\d,.]+)/gi,
    "SimilarWeb visitors: $1"
  );

  text = text.replace(
    /store\s+(?:h|age)\s*(\d+\s*(?:months?|years?))/gi,
    "Store age: $1"
  );

  text = text.replace(
    /facebook\s+(?:at|ad)\s+library/gi,
    "Facebook Ad Library"
  );

  text = text.replace(
    /offered\s+by\s+two\s+get\s+one\s+free/gi,
    "Buy 2 Get 1 Free"
  );

  text = text.replace(
    /nodes?\s+(.*?)(?=\s+google\s+ads\b|$)/gi,
    "Notes: $1"
  );

  return text;
}


function extractNumber(text) {

  const match = text.match(/(\d[\d,.]*)/);

  if (!match) return "";

  return match[1].replace(/,/g, "");
}


function processSpeech() {

  let text = document.getElementById("transcript").value;

  text = normalizeSpeech(text);

  document.getElementById("transcript").value = text;

  // Store link
  let match = text.match(
    /https?:\/\/[^\s]+/i
  );

  if (match) {
    document.getElementById("storeLink").value =
      match[0].replace(/[.,]$/, "");
  }

  // Facebook ads
  match = text.match(
    /facebook\s+ads\s*live\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {
    document.getElementById("facebookAds").value =
      match[1].replace(/,/g, "");
  }

  // SimilarWeb
  match = text.match(
    /similarweb\s+visitors\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {
    document.getElementById("similarWeb").value =
      match[1].replace(/,/g, "");
  }

  // Store age
  match = text.match(
    /store\s+age\s*:?\s*([^,.;]+?(?:months?|years?))/i
  );

  if (match) {
    document.getElementById("storeAge").value =
      match[1].trim();
  }

  // Found through
  match = text.match(
    /found\s+through\s*:?\s*(.*?)(?=\s+(?:offer|notes?|google\s+ads)\b|$)/i
  );

  if (match) {
    document.getElementById("foundThrough").value =
      match[1].trim();
  }

  // Offer
  match = text.match(
    /offer(?:ed)?\s*(?:by)?\s*:?\s*(.*?)(?=\s+(?:notes?|google\s+ads)\b|$)/i
  );

  if (match) {
    let offer = match[1].trim();

    offer = offer
      .replace(/two\s+get\s+one/gi, "Buy 2 Get 1")
      .replace(/2\s+get\s+1/gi, "Buy 2 Get 1");

    document.getElementById("offer").value =
      offer;
  }

  // Notes
  match = text.match(
    /notes?\s*:?\s*(.*?)(?=\s+google\s+ads\b|$)/i
  );

  if (match) {
    document.getElementById("notes").value =
      match[1].trim();
  }

  // Google ads
  match = text.match(
    /google\s+ads\s*:?\s*(\d[\d,.]*)/i
  );

  if (match) {
    document.getElementById("googleAds").value =
      match[1].replace(/,/g, "");
  }

  document.getElementById("status").innerText =
    "✅ Information structured. Check the fields above.";
}


function submitToSheet() {

  // Make sure the latest speech is processed first
  processSpeech();

  document.getElementById("formStoreLink").value =
    document.getElementById("storeLink").value;

  document.getElementById("formFacebookAds").value =
    document.getElementById("facebookAds").value;

  document.getElementById("formSimilarWeb").value =
    document.getElementById("similarWeb").value;

  document.getElementById("formStoreAge").value =
    document.getElementById("storeAge").value;

  document.getElementById("formFoundThrough").value =
    document.getElementById("foundThrough").value;

  document.getElementById("formOffer").value =
    document.getElementById("offer").value;

  document.getElementById("formNotes").value =
    document.getElementById("notes").value;

  document.getElementById("formGoogleAds").value =
    document.getElementById("googleAds").value;

  document.getElementById("sheetForm").submit();

  document.getElementById("status").innerText =
    "✅ Competitor sent to Google Sheet.";
}

</script>

</body>
</html>
